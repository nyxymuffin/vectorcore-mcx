# VectorCore MCX example configuration.
#
# `make install` copies this file to /opt/vectorcore/etc/mcxas.yaml and the
# service runs it as-is, so review every value before deploying. The addresses
# below use the RFC 5737 documentation range and the reserved 3GPP test PLMN,
# and are placeholders: they will not carry traffic anywhere.

api:
  listen: ":8080"

sip:
  # standalone: terminate client REGISTERs directly (no IMS core needed).
  # application_server: the TS 23.280 posture - an AS behind a SIP core on
  # ISC, consuming third-party REGISTERs and binding the MCPTT ID from the
  # access token in the message/sip body (TS 24.379 clause 7.3.2). Binding
  # requires sip.auth to be configured; standalone remains the default until
  # an IMS core exists in the deployment.
  mode: "standalone" # standalone | application_server
  udp_listen: ":5060"
  tcp_listen: ":5060"
  # SIP over TLS (RFC 3261 sips transport). Empty disables the listener.
  # Requires the tls section below, whose certificates it serves.
  # tls_listen: ":5061"
  # Address peers reach this server on. It is advertised in Contact and
  # Record-Route, so it must be routable from both the UEs and the IMS core.
  advertise_host: "192.0.2.10"
  advertise_port: 5060
  transport: "udp" # udp | tcp
  record_route: true
  # preserve keeps the learned IMS route order for in-dialog NOTIFY, giving
  # AS -> S-CSCF -> P-CSCF -> UE. reverse is for non-standard deployments.
  notify_route_set_order: "preserve" # preserve | reverse
  options:
    enabled: false
    interval: "30s"
  # Groups homed at a remote controlling MCPTT function (a partner MC system,
  # an IWF toward an LMR system, or a gateway server). Calls to a listed group
  # are relayed per TS 24.379 clauses 10.1.1.3.1.1 / 6.3.2.1.3: this server
  # acts as the originating participating function only. Groups not listed
  # here home locally.
  # remote_groups:
  #   - group_uri: "sip:interop_group@partner.example"
  #     controlling_psi: "sip:mcptt-ctrl@partner.example"
  #     target: "203.0.113.7:5060"
  #     transport: "udp" # udp | tcp | tls
  auth:
    # Service authorization (TS 33.180 clause 5.1.3.2.3): validate the access
    # token carried in the service-authorization PUBLISH before believing the
    # asserted MCPTT identity. Requires the JWKS of the identity management
    # server; the development shim exports its set at /idms/jwks.json.
    # Tokens must be ES256; alg:none and unknown algorithms are refused, and
    # a missing or unloadable JWKS refuses every request rather than admitting
    # them.
    require_service_authorization: false
    trusted_jwks_file: ""
    # When set, the token's iss claim must match exactly.
    trusted_issuer: ""
  # Ad hoc group calls (TS 24.379 clause 17): a caller supplies the
  # participant list in the INVITE (application/resource-lists+xml) instead of
  # using a provisioned group. These two knobs stand in for the ad hoc
  # elements of the MCPTT service configuration document (clause 17.4.2.2
  # steps 5 and 6) until the CMS generates one.
  adhoc:
    # false answers ad hoc originations 403 with warning "186".
    enabled: true
    # Maximum participants per ad hoc call (403 with warning "189" when
    # exceeded); 0 means no limit.
    max_participants: 0
    # Ad hoc group call timer (TS 24.379 clause 17.4.2.2 step 13): the call
    # is released after this many seconds. 0 disables.
    max_call_duration_seconds: 0
  private_call:
    # Max private call duration (TS 24.379 clause 11.1.1.4.1 step 10); the
    # call is released after this many seconds. 0 disables.
    max_duration_seconds: 0
  emergency:
    # TNG2, the in-progress emergency group call timer (TS 24.379 clause
    # 6.3.3.1.16): the group's emergency state returns to normal after this
    # many seconds. Also advertised as <group-time-limit> in the generated
    # service configuration. 0 disables (the state then persists until the
    # group's last leg ends).
    group_time_limit_seconds: 300

cms:
  enabled: true
  listen: ":8100"
  # Derived from sip.advertise_host and cms.listen when omitted.
  # xcap_root: "http://192.0.2.10:8100/xcap-root"

media:
  enabled: true
  listen_host: "0.0.0.0"
  # Defaults to sip.advertise_host when omitted.
  # advertise_host: "192.0.2.10"
  direction: "sendrecv" # sendrecv | recvonly | sendonly | inactive
  # The three media ports must differ. Note rtcp_port defaults to
  # audio_port + 1, so setting audio_port to 40001 would collide with the
  # default floor_control_port.
  audio_port: 40000
  rtcp_port: 40001
  floor_control_port: 40002
  floor_auto_grant: true
  floor_grant_duration_seconds: 30
  # Timer T1 "End of RTP media" (TS 24.380 clause 6.3.4.4.3): a granted
  # talker silent for this many seconds loses the floor. Matches the
  # <T1-end-of-rtp-media> advertised in the generated service configuration.
  # -1 disables the sweep.
  floor_t1_seconds: 5
  log_packets: false
  log_packet_interval: 100

database:
  driver: "sqlite" # sqlite | postgres | postgresql
  # Relative to the working directory, which is /opt/vectorcore under the
  # systemd unit. Do not place this under /tmp: the unit sets PrivateTmp, so
  # the database would be discarded on every restart.
  dsn: "mcxas.db"
  # For PostgreSQL, do not commit a password to this file. Prefer peer/ident
  # or client-certificate authentication, or a ~/.pgpass entry owned by the
  # service account, and keep TLS verification on:
  # driver: "postgres"
  # dsn: "postgres://mcxas@db.example.net:5432/mcxas?sslmode=verify-full"

log:
  file: "mcxas.log"
  level: "info" # debug | info | warn | error

ims:
  # 001/01 is the reserved test PLMN. Replace with the operator's own values.
  # ims.realm and every mcx.* identity are derived from these when unset, so
  # changing the PLMN here is normally the only edit required.
  mcc: "001"
  mnc: "01"
  # realm: "ims.mnc01.mcc001.3gppnetwork.org"

# The mcx.* identities are all derived from ims.mcc, ims.mnc and
# sip.advertise_host. Set them only to override that derivation, and revisit
# them whenever the PLMN changes, otherwise they will silently go stale:
#
# mcx:
#   sip_identity: "sip:mcptt-as@ims.mnc01.mcc001.3gppnetwork.org"
#   server_name: "sip:mcptt-as.ims.mnc01.mcc001.3gppnetwork.org"
#   default_user_identity: "sip:mcptt-user@ims.mnc01.mcc001.3gppnetwork.org"
#   default_group_uri: "sip:mcptt-group@ims.mnc01.mcc001.3gppnetwork.org"
#   ue_xui_uri: "sip:mcptt-user@ims.mnc01.mcc001.3gppnetwork.org"
#   ue_instance_id_urn: "urn:uuid:00000000-0000-4000-8000-000000000001"
#   cms_uri: "sip:mcptt-as@ims.mnc01.mcc001.3gppnetwork.org"
#   gms_uri: "sip:mcptt-as@ims.mnc01.mcc001.3gppnetwork.org"
#   kms_uri: "sip:mcptt-as@ims.mnc01.mcc001.3gppnetwork.org"
#   idms_auth_endpoint: "http://192.0.2.10:8080/idms/authorize"
#   idms_token_endpoint: "http://192.0.2.10:8080/idms/token"
#   http_proxy_uri: "http://192.0.2.10:8080"

idms:
  # Built-in development identity shim.
  #
  # This is NOT an implementation of 3GPP TS 24.482. It performs no user
  # authentication whatsoever: any caller that can reach /idms/token is issued
  # a token asserting a provisioned subscriber's MCPTT identity. Enable it only
  # on an isolated bring-up network, and point mcx.idms_*_endpoint at a real
  # identity management server for anything else.
  #
  # When disabled, the /idms/* paths are not registered at all.
  development_shim_enabled: false

  # ES256 signing key for shim-issued tokens, PEM encoded (SEC 1 or PKCS#8,
  # P-256). Left empty an ephemeral key is generated at startup, so tokens stop
  # verifying across a restart. The public key is served at /idms/jwks.json.
  signing_key_file: ""

  # Value placed in the "iss" claim. Defaults to vectorcore-mcx-idms.
  issuer: ""

  # Redirect URIs the shim will send an authorization code to. Required when
  # the shim is enabled, and matched exactly: TS 33.180 Annex B.3 requires
  # clients and their redirect URIs to be pre-registered, and an unrestricted
  # redirect_uri is an open redirect that leaks the code.
  allowed_redirect_uris: []

tls:
  # TLS for the two HTTP listeners (OAM API on api.listen, CMS/XCAP on
  # cms.listen). TS 33.180 makes TLS on HTTP-1 mandatory, so running without
  # it is a lab convenience, not a peer configuration.
  #
  # When enabled, every derived URL (cms.xcap_root, the mcx.idms_*_endpoint
  # values, mcx.http_proxy_uri) advertises https automatically.
  #
  # SIP transport security is separate and will be configured under sip.
  enabled: false
  # PEM certificate chain and private key. Required when enabled.
  cert_file: ""
  key_file: ""
  # Optional mutual TLS: when set, clients must present a certificate that
  # verifies against this CA bundle.
  client_ca_file: ""
  # CA bundle appended to the system roots when this server dials TLS peers
  # itself (outbound SIP over TLS). Point this at the internal PKI's issuing
  # CA; peer verification is never skipped.
  peer_ca_file: ""
  min_version: "1.2" # 1.2 | 1.3
